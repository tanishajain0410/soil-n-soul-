<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default Title & Description (overridden per-page by useSEO hook) -->
    <title>Best Tours & Travel Agency in Varanasi | Soil N Soul</title>
    <meta name="description" content="Book trusted tours & travel packages in Varanasi with Soil N Soul Travels. Ganga Aarti, pooja booking, city tours, car rental & spiritual packages from ₹999." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.soilnsoultravels.com/" />

    <!-- Default Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soil N Soul Travels" />
    <meta property="og:title" content="Best Tours & Travel Agency in Varanasi | Soil N Soul" />
    <meta property="og:description" content="Book trusted tours & travel packages in Varanasi with Soil N Soul Travels. Ganga Aarti, pooja booking, city tours, car rental & spiritual packages from ₹999." />
    <meta property="og:image" content="https://www.soilnsoultravels.com/images/hero/hero-1.jpg" />
    <meta property="og:url" content="https://www.soilnsoultravels.com/" />

    <!-- Default Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Best Tours & Travel Agency in Varanasi | Soil N Soul" />
    <meta name="twitter:description" content="Book trusted tours & travel packages in Varanasi with Soil N Soul Travels. Ganga Aarti, pooja booking, city tours, car rental & spiritual packages from ₹999." />
    <meta name="twitter:image" content="https://www.soilnsoultravels.com/images/hero/hero-1.jpg" />

    <!-- Instant dark background: eliminates white flash before CSS loads -->
    <style>
      html, body { background: #1A120B; margin: 0; padding: 0; }
      #root {
        opacity: 0;
        animation: rootFadeIn 0.35s ease-out 0.05s forwards;
      }
      @keyframes rootFadeIn { to { opacity: 1; } }
    </style>

    <!-- Preconnect to Google Fonts: reduces font-load latency & layout shift -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
